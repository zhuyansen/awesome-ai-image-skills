name: Add a repo
description: Suggest an open-source image generation skill or MCP server for AI agents
title: "Add: owner/repo"
labels: ["submission"]
body:
  - type: input
    id: url
    attributes:
      label: GitHub URL
      placeholder: https://github.com/owner/repo
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What kind of project is it?
      options:
        - GPT Image
        - Nano Banana & Gemini
        - Open models (Flux, SD)
        - Image editing
        - Design assets
        - MCP servers
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Anything the README does not say
      description: Optional. The review reads the README, so the best way to get listed is a README that shows it working.
